version: '3.8'

services:
  # InfluxDB - Time-series database for market data storage
  influxdb:
    image: influxdb:2.7
    container_name: market_data_influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: "market_data"
      INFLUXDB_ADMIN_USER: "admin"
      INFLUXDB_ADMIN_PASSWORD: "admin123"
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUX_ORG: "market_data"
      INFLUX_BUCKET: "market_data_bucket"
      INFLUX_RETENTION: "30d"
      INFLUX_TOKEN: "market_data_token_change_me"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./config/influxdb-init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - market_data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - Visualization and dashboarding
  grafana:
    image: grafana/grafana:10.2
    container_name: market_data_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin123"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - market_data_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ZMQ Message Broker (optional - for local testing)
  zmq_broker:
    image: python:3.11-slim
    container_name: market_data_zmq_broker
    command: >
      bash -c "pip install zmq && python -c '
      import zmq
      context = zmq.Context()
      frontend = context.socket(zmq.SUB)
      frontend.bind(\"tcp://*:5559\")
      frontend.setsockopt(zmq.SUBSCRIBE, b\"\")
      backend = context.socket(zmq.PUB)
      backend.bind(\"tcp://*:5560\")
      zmq.device(zmq.FORWARDER, frontend, backend)
      '"
    ports:
      - "5559:5559"
      - "5560:5560"
      - "5561:5561"
    networks:
      - market_data_network
    restart: unless-stopped

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: market_data_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - market_data_network

volumes:
  influxdb_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  market_data_network:
    driver: bridge
