version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(message)s'
  
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/market_data/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /var/log/market_data/error.log
    maxBytes: 10485760
    backupCount: 10
  
  access_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: /var/log/market_data/access.log
    maxBytes: 10485760
    backupCount: 5

loggers:
  market_data_platform:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  market_data_platform.api:
    level: INFO
    handlers: [console, access_file]
    propagate: false
  
  market_data_platform.gateway:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  market_data_platform.processor:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  urllib3:
    level: WARNING
  
  requests:
    level: WARNING
  
  sqlalchemy:
    level: WARNING

root:
  level: INFO
  handlers: [console, file, error_file]
