apiVersion: v1
kind: ConfigMap
metadata:
  name: go-gateway-config
  namespace: market-data
data:
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  GATEIO_API_ENDPOINT: "https://api.gateio.ws/api/v4"

---
apiVersion: v1
kind: Secret
metadata:
  name: go-gateway-secrets
  namespace: market-data
type: Opaque
stringData:
  DATABASE_URL: "postgresql://mdp_user:mdp_password@postgres-service:5432/market_data"
  REDIS_URL: "redis://redis-service:6379/1"
  GATEIO_API_KEY: "REPLACE_WITH_ACTUAL_KEY"
  GATEIO_API_SECRET: "REPLACE_WITH_ACTUAL_SECRET"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gateway
  namespace: market-data
  labels:
    app: go-gateway
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: go-gateway
  template:
    metadata:
      labels:
        app: go-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: go-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: go-gateway
        image: market-data-platform:go-latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9000
          protocol: TCP
        
        env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: go-gateway-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: go-gateway-config
              key: ENVIRONMENT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: go-gateway-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: go-gateway-secrets
              key: REDIS_URL
        - name: GATEIO_API_KEY
          valueFrom:
            secretKeyRef:
              name: go-gateway-secrets
              key: GATEIO_API_KEY
        - name: GATEIO_API_SECRET
          valueFrom:
            secretKeyRef:
              name: go-gateway-secrets
              key: GATEIO_API_SECRET
        
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        - name: config
          mountPath: /etc/gateway/config
          readOnly: true
      
      volumes:
      - name: config
        configMap:
          name: go-gateway-config
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - go-gateway
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-gateway
  namespace: market-data

---
apiVersion: v1
kind: Service
metadata:
  name: go-gateway-service
  namespace: market-data
  labels:
    app: go-gateway
spec:
  type: ClusterIP
  selector:
    app: go-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9000
    targetPort: metrics
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-gateway-hpa
  namespace: market-data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: go-gateway-pdb
  namespace: market-data
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: go-gateway
