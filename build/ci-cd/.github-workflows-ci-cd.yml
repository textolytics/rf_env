name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: market-data-platform

jobs:
  # Python tests
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Lint with pylint
      run: pylint market_data_platform --exit-zero
      continue-on-error: true
    
    - name: Format check with black
      run: black --check market_data_platform tests
      continue-on-error: true
    
    - name: Type check with mypy
      run: mypy market_data_platform --ignore-missing-imports
      continue-on-error: true
    
    - name: Run unit tests
      run: pytest tests/unit/ -v --cov=market_data_platform --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: python
        name: python-${{ matrix.python-version }}

  # Go tests
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.20', '1.21']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Install dependencies
      run: |
        cd go
        go mod download
        go mod verify
    
    - name: Run Go tests
      run: |
        cd go
        go test ./... -v -race -coverprofile=coverage.out
    
    - name: Run Go lint
      run: |
        cd go
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        golangci-lint run ./...
      continue-on-error: true
    
    - name: Build Go binary
      run: |
        cd go
        go build -v -o ../bin/gateway ./cmd/gateway

  # Rust tests
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: ['stable', 'beta']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Rust ${{ matrix.rust-version }}
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ matrix.rust-version }}
        override: true
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('rust/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('rust/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: rust/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('rust/Cargo.lock') }}
    
    - name: Run Rust tests
      run: |
        cd rust
        cargo test --release -- --test-threads=1
    
    - name: Run Rust clippy
      run: |
        cd rust
        cargo clippy --release -- -D warnings
      continue-on-error: true
    
    - name: Format check
      run: |
        cd rust
        cargo fmt -- --check
      continue-on-error: true
    
    - name: Build Rust binary
      run: |
        cd rust
        cargo build --release

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests, rust-tests]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio
    
    - name: Run integration tests
      run: pytest tests/integration/ -v
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0

  # Docker build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests, rust-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Python image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./build/docker/Dockerfile.python
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:python-${{ github.sha }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:python-latest
        cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:python-latest
        cache-to: type=inline
    
    - name: Build and push Go image
      uses: docker/build-push-action@v4
      with:
        context: ./go
        file: ./build/docker/Dockerfile.go
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:go-${{ github.sha }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:go-latest
        cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:go-latest
        cache-to: type=inline
    
    - name: Build and push Rust image
      uses: docker/build-push-action@v4
      with:
        context: ./rust
        file: ./build/docker/Dockerfile.rust
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:rust-${{ github.sha }}
          ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:rust-latest
        cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}:rust-latest
        cache-to: type=inline

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # Deployment (manual trigger on main)
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Deploy to Kubernetes
      run: |
        bash build/scripts/deploy.sh
      env:
        NAMESPACE: market-data
        ENVIRONMENT: production
